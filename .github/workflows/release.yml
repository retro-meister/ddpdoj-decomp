name: Desktop releases

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, shell: 'msys2 {0}' }
          - { platform: macos-arm64, runner: macos-15, shell: bash }
          - { platform: linux-x64, runner: ubuntu-22.04, shell: bash }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('preview-{0}-{1}', github.run_number, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
            file zip unzip
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build squashfs-tools desktop-file-utils libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libudev-dev libvulkan-dev
          curl -fsSL --retry 3 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 -o runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum -c -
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime' | sha256sum -c -
          chmod +x appimagetool
      - name: Build and install
        run: |
          set -eu
          cmake -S pc -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=11 -DBUILD_TESTING=OFF -DDDPDOJ_BONUS_FEATURES=ON
          cmake --build build/ci --parallel 4 --target ddpdoj_main ddpdoj_death ddpdoj_gallery_host
          cmake --install build/ci --prefix "$PWD/stage"
      - name: Package and test the download
        run: bash tools/package-desktop.sh "${{ matrix.platform }}" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ddpdoj-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Show download instructions
        shell: bash
        run: |
          echo 'Download **ddpdoj-${{ matrix.platform }}** from this run’s Artifacts section and extract the artifact ZIP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the package inside. On Linux, mark the AppImage executable first. Select your own retail PS2 ISO on first launch.' >> "$GITHUB_STEP_SUMMARY"

  draft:
    name: Create draft release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ddpdoj-*
          path: dist
          merge-multiple: true
      - name: Attach tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/launch.txt" <<'NOTES'
          First desktop pre-release with bonus features enabled, including Black Label.

          Download the file for your system. On first launch, select your retail DoDonPachi DaiOuJou PS2 ISO (SLPS-252.33).
          * Windows x64 — extract the whole ZIP, then open ddpdoj.exe.
          * macOS Apple Silicon — extract the ZIP, drag DaiOuJou.app to Applications, then open it. This build is ad-hoc signed and is not notarized.
          * Linux x64 — mark the AppImage executable and open it. If FUSE is unavailable, launch it with --appimage-extract-and-run.
          NOTES
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft --prerelease --title "DaiOuJou $TAG" --notes-file "$RUNNER_TEMP/launch.txt"
          fi
